// Talewright saved game body, format version 3.
//
// Documentation only: nothing is generated from this file. SaveFormat.cs reads and writes these messages by hand,
// and SaveFormatTests checks that every field number here matches the SaveFields constants.
// The body is wrapped as: "TWSV", version byte 3, varint body length, then a zlib stream. See docs/developer/save-format.md.
//
// Field numbers are permanent. Never reuse or retype one; reserve removed numbers instead.
syntax = "proto3";

package talewright.save.v3;

message Save {
  string story_id = 1;
  string story_version = 2;
  string content_fingerprint = 3;
  fixed64 seed = 4;
  uint32 cursor = 5;
  // Absent for stories with a predefined protagonist.
  Character character = 6;
  // Distinct choice keys, in the order each first appears in choices.
  repeated string choice_keys = 7;
  // The full choice history, including redo, as indexes into choice_keys.
  repeated uint32 choices = 8;
  // Display details for save lists. Not part of replay; ignored if damaged.
  Summary summary = 9;
}

message Character {
  optional string first_name = 1;
  optional string last_name = 2;
  optional string pronouns = 3;
  optional string preset = 4;
  // Written in ordinal id order. A repeated id keeps the last value.
  repeated Stat stats = 5;
}

message Stat {
  string id = 1;
  sint32 value = 2;
}

message Summary {
  string scene_title = 1;
  // .NET ticks (100 ns since 0001-01-01) in UTC.
  uint64 saved_at_utc_ticks = 2;
  // Local offset from UTC, at most 14 hours either way.
  sint32 offset_minutes = 3;
  optional string character_name = 4;
}
