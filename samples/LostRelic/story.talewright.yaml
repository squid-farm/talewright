# The Lost Relic — Talewright sample story.
# This manifest and the four chapter files form one story.
# See docs/reference/talemark-syntax.md for the full format.

game:
  id: lost-relic
  title: The Lost Relic
  version: 0.4.0
  start: camp.arrival
  randomness: checks-only # dice are rolled only for skill-check directives
  # seed: 1234            # uncomment for the same rolls every playthrough
  undo: true
  ruleset:
    base: generic # d20-style attributes, skills, hp, xp and levels
    disable: [performance] # no stage performances on this expedition
    stats:
      - id: courage
        name: Courage
        category: custom
        min: 0
        max: 10
        default: 0
      - id: lucidity
        name: Lucidity
        category: skill
        min: 0
        max: 10
        default: 0
  creation:
    name: true
    pronouns: [she, they, he]
    stats:
      str: [8, 12, 16]
      courage: [3, 0, 6]
    presets:
      explorer:
        label: Explorer
        stats: {str: 12, athletics: 2, hp: 15}
      scholar:
        label: Scholar
        stats: {str: 8, history: 5, lucidity: 3, hp: 10}

characters:
  player:
    first-name: Mara
    last-name: Burns
    pronouns: she
    stats:
      str: 12
      dex: 14
      int: 13
      wis: 12
      athletics: 2
      perception: 2
      history: 3
    inventory: [torch, journal]
  guide:
    first-name: Tomas
    last-name: Okafor
    pronouns:
      subject: he
      object: him
      possessive-pronoun:
        determiner: his
        independent: his
      reflexive: himself
      agreement: singular
    stats: { survival: 4, wis: 14 }

factions:
  explorers-guild: { name: "Explorers' Guild", standing: 5 }

items:
  torch: { name: sputtering torch }
  journal: { name: field journal }
  rope: { name: coil of rope }
  charm: { name: jade charm, modifiers: { wis: 2 } }
  idol: { name: obsidian idol }
  relic: { name: Relic of Ysh, modifiers: { cha: 2 } }
  ration: { name: trail ration }

flags: [packing-open]
vars:
  supplies: 0
  watchword: "quiet river"

triggers:
  - id: guild-wary
    when: faction:explorers-guild <= unfriendly
    do: set flag:guild-wary
    once: true
  - id: courage-earned
    when: player:courage >= 10
    do: set flag:steady
    once: true
  - id: watch-bell
    when: flag:bell-ringing
    do: var:bell-count += 1
    once: false # fires again only after the condition becomes false, then true
