name: Tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test Talewright.slnx -c Release --logger trx --results-directory artifacts/unit
      - name: Check bounded story and replay performance budgets
        env:
          DOTNET_TieredCompilation: '0'
        run: dotnet run --project tests/Talewright.Benchmarks -c Release
      - name: Require executed unit tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path("artifacts/unit").glob("*.trx"))
          projects = ET.parse("Talewright.slnx").findall(".//Project")
          expected = sum(project.attrib["Path"].endswith(".Tests.csproj") for project in projects)
          assert len(reports) == expected, f"Expected {expected} unit test reports; found {len(reports)}"
          for report in reports:
              counters = ET.parse(report).find(".//{*}Counters")
              assert counters is not None and int(counters.attrib["executed"]) > 0, f"No tests executed: {report}"
              assert int(counters.attrib["failed"]) == 0, f"Failed tests: {report}"
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results
          path: artifacts/unit
          if-no-files-found: error

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/squid-farm/talewright-ui-tests:pw1.63.0-r1
      options: --user 1001:1001 --init --shm-size=1g
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - name: Verify prebuilt UI test environment
        run: python3 .github/docker/ui-tests/verify.py
      - run: python3 tests/run_e2e.py web --browser ${{ matrix.browser }} --filter 'FullyQualifiedName!~RealCorpus'
      - name: Verify standalone story under a nested static path
        env:
          BROWSER: ${{ matrix.browser }}
          TALEWRIGHT_STANDALONE: '1'
          TALEWRIGHT_STANDALONE_CREATION: '1'
          TALEWRIGHT_PUBLISHED_CHARACTER: Mara
          TALEWRIGHT_WEB_ROOT: ${{ github.workspace }}/artifacts/standalone-web
          TALEWRIGHT_WEB_BASE_PATH: /games/published
        run: |
          dotnet run --project src/Talewright.Cli -c Release -- publish samples/LostRelic -a --target web --output artifacts/standalone-web.zip
          unzip -q artifacts/standalone-web.zip -d artifacts/standalone-web
          dotnet test tests/Talewright.Player.E2E.Tests -c Release --no-build --filter Artifact=Standalone \
            --logger "trx;LogFileName=standalone-${BROWSER}.trx" --results-directory artifacts/test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-${{ matrix.browser }}
          path: artifacts/test-results
          if-no-files-found: error

  linux-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/squid-farm/talewright-ui-tests:pw1.63.0-r1
      options: --user 1001:1001 --init --shm-size=1g
    steps:
      - uses: actions/checkout@v4
      - name: Verify prebuilt UI test environment
        run: python3 .github/docker/ui-tests/verify.py
      - name: Verify native chooser and accessibility before the full suite
        run: python3 tests/run_e2e.py linux --probe
      - run: python3 tests/run_e2e.py linux --filter 'FullyQualifiedName!~RealCorpus'
      - name: Verify self-contained standalone desktop executable
        env:
          TALEWRIGHT_STANDALONE: '1'
          TALEWRIGHT_STANDALONE_CREATION: '1'
          TALEWRIGHT_PUBLISHED_CHARACTER: Mara
          TALEWRIGHT_DESKTOP_EXECUTABLE: ${{ github.workspace }}/artifacts/standalone-linux/start.sh
        run: |
          cp artifacts/test-results/linux.trx artifacts/test-results/linux-regression.trx
          dotnet run --project src/Talewright.Cli -c Release -- publish samples/LostRelic -a --target desktop --output artifacts/standalone-linux.zip
          unzip -q artifacts/standalone-linux.zip -d artifacts/standalone-linux
          python3 tests/run_e2e.py linux --filter Artifact=Standalone
          mv artifacts/test-results/linux.trx artifacts/test-results/linux-standalone.trx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-linux-desktop
          path: artifacts/test-results
          if-no-files-found: error
