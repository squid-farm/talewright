name: Tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test Talewright.slnx -c Release --logger trx --results-directory artifacts/unit
      - name: Require executed unit tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path("artifacts/unit").glob("*.trx"))
          assert len(reports) == 5, f"Expected five unit test reports; found {len(reports)}"
          for report in reports:
              counters = ET.parse(report).find(".//{*}Counters")
              assert counters is not None and int(counters.attrib["executed"]) > 0, f"No tests executed: {report}"
              assert int(counters.attrib["failed"]) == 0, f"Failed tests: {report}"
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results
          path: artifacts/unit
          if-no-files-found: error

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: python3 tests/run_e2e.py install-browsers --browser ${{ matrix.browser }}
      - run: python3 tests/run_e2e.py web --browser ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-${{ matrix.browser }}
          path: artifacts/test-results
          if-no-files-found: error

  linux-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install native GUI prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0 libnotify4 libgtk-3-0t64 \
            xvfb xauth dbus-x11 at-spi2-core libatk-adaptor python3-pyatspi python3-gi \
            gir1.2-gtk-3.0 xfwm4 wmctrl
      - run: python3 tests/run_e2e.py linux
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-linux-desktop
          path: artifacts/test-results
          if-no-files-found: error
