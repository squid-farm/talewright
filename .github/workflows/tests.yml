name: Tests

on:
  workflow_call:
    inputs:
      selected:
        description: Graph-derived job selection; empty means standalone full verification
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      selected: ${{ steps.plan.outputs.selected }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        if: inputs.selected == ''
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        if: inputs.selected == ''
        with:
          global-json-file: global.json
      - name: Use caller selection or generate a full-verification plan
        id: plan
        env:
          SELECTED: ${{ inputs.selected }}
        run: |
          if [[ -n "$SELECTED" ]]; then
            echo "selected=$SELECTED" >> "$GITHUB_OUTPUT"
          else
            python3 .github/scripts/nx_ci.py select --full
          fi
      - uses: actions/upload-artifact@v4
        if: inputs.selected == ''
        with:
          name: nx-ci-plan
          path: artifacts/ci/plan.json
          if-no-files-found: error

  unit:
    needs: plan
    if: fromJSON(needs.plan.outputs.selected).unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          name: nx-ci-plan
          path: artifacts/ci
      - run: python3 .github/scripts/nx_ci.py run unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results
          path: tests/*/artifacts/unit
          if-no-files-found: error

  browser:
    needs: plan
    if: fromJSON(needs.plan.outputs.selected).browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/squid-farm/talewright-ui-tests:pw1.63.0-r1
      options: --user 1001:1001 --init --shm-size=1g
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify prebuilt UI test environment
        run: python3 .github/docker/ui-tests/verify.py
      - uses: actions/download-artifact@v4
        with:
          name: nx-ci-plan
          path: artifacts/ci
      - run: python3 .github/scripts/nx_ci.py run browser --browser ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-${{ matrix.browser }}
          path: artifacts/test-results
          if-no-files-found: error

  linux-desktop:
    needs: plan
    if: fromJSON(needs.plan.outputs.selected)['linux-desktop']
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/squid-farm/talewright-ui-tests:pw1.63.0-r1
      options: --user 1001:1001 --init --shm-size=1g
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify prebuilt UI test environment
        run: python3 .github/docker/ui-tests/verify.py
      - uses: actions/download-artifact@v4
        with:
          name: nx-ci-plan
          path: artifacts/ci
      - run: python3 .github/scripts/nx_ci.py run linux-desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-linux-desktop
          path: artifacts/test-results
          if-no-files-found: error

  editor:
    needs: plan
    if: fromJSON(needs.plan.outputs.selected).editor
    uses: ./.github/workflows/editor-tooling.yml

  checks:
    needs: plan
    if: fromJSON(needs.plan.outputs.selected).checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          name: nx-ci-plan
          path: artifacts/ci
      - name: Run selected CI, documentation and bounded performance checks
        env:
          DOTNET_TieredCompilation: '0'
        run: python3 .github/scripts/nx_ci.py run checks

  verification:
    if: always()
    needs: [plan, unit, browser, linux-desktop, editor, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Reject failures, cancellations and unexpected skips
        env:
          NEEDS: ${{ toJSON(needs) }}
          SELECTED: ${{ needs.plan.outputs.selected }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, ".github/scripts")
          from nx_ci import verify_results
          results = json.loads(os.environ["NEEDS"])
          if results["plan"]["result"] != "success":
              raise SystemExit("Verification planning failed, was skipped, or was cancelled")
          selected = json.loads(os.environ["SELECTED"])
          expected = {job: selected[job] for job in ("unit", "browser", "linux-desktop", "editor", "checks")}
          verify_results(results, {"plan": True, **expected})
          PY
