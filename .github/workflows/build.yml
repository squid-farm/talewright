name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      hosted_rollback:
        description: Retained hosted-player tag to select at the root (optional)
        required: false
        type: string
  schedule:
    - cron: '37 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      selected: ${{ steps.select.outputs.selected }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Validate public release tag
        if: github.ref_type == 'tag'
        run: python3 .github/scripts/package_version.py --tag "$GITHUB_REF_NAME" --release-json
      - name: Select verification from the Nx task graph
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$EVENT" == pull_request ]]; then
            python3 .github/scripts/nx_ci.py select --base "$BASE" --head "$HEAD"
          else
            python3 .github/scripts/nx_ci.py select --full
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nx-ci-plan
          path: artifacts/ci/plan.json
          if-no-files-found: error

  build:
    needs: select
    if: fromJSON(needs.select.outputs.selected).build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Resolve package version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version=$(python3 .github/scripts/package_version.py --tag "$GITHUB_REF_NAME")
          else
            version=$(python3 .github/scripts/package_version.py --ci "$GITHUB_RUN_NUMBER")
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: nx-ci-plan
          path: artifacts/ci
      - name: Build, pack and verify selected clean consumers
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 .github/scripts/nx_ci.py run build
      - uses: actions/upload-artifact@v4
        id: packages
        with:
          name: nuget-packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
      - name: Summarize Nx execution
        if: always()
        env:
          NX_CI_ARTIFACT_URL: ${{ steps.packages.outcome == 'success' && steps.packages.outputs.artifact-url || '' }}
        run: python3 .github/scripts/nx_ci.py summary build

  tests:
    needs: select
    uses: ./.github/workflows/tests.yml
    with:
      selected: ${{ needs.select.outputs.selected }}

  verification:
    name: CI verification
    if: always()
    needs: [select, build, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require successful selection and every selected job
        env:
          NEEDS: ${{ toJSON(needs) }}
          SELECTED: ${{ needs.select.outputs.selected }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, ".github/scripts")
          from nx_ci import verify_results
          results = json.loads(os.environ["NEEDS"])
          if results["select"]["result"] != "success":
              raise SystemExit("Nx selection failed, was skipped, or was cancelled")
          selected = json.loads(os.environ["SELECTED"])
          verify_results(results, {"select": True, "build": selected["build"], "tests": True})
          PY

  publish-samples:
    needs: [build, tests, verification]
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.hosted_rollback != '')
    permissions:
      contents: write
      actions: read
      deployments: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-samples.yml
    with:
      rollback_tag: ${{ inputs.hosted_rollback || '' }}

  cli-archives:
    needs: [build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64, win-x64, win-arm64, osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Publish and inspect self-contained CLI and debugger
        env:
          VERSION: ${{ needs.build.outputs.version }}
          RID: ${{ matrix.rid }}
        run: bash .github/scripts/package_cli.sh "$VERSION" "$RID"
      - name: Smoke-test Linux x64 CLI
        if: matrix.rid == 'linux-x64'
        run: |
          artifacts/cli/linux-x64/Talewright.Cli --help
          artifacts/cli/linux-x64/Talewright.Cli validate samples/LostRelic --non-interactive
          artifacts/cli/linux-x64/Talewright.Cli publish samples/LostRelic --output artifacts/cli-smoke.zip --non-interactive
          unzip -tq artifacts/cli-smoke.zip
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.rid }}
          path: artifacts/cli-archives/*
          if-no-files-found: error

  provisional-vsix:
    needs: [build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [linux-arm64, win32-x64, win32-arm64, darwin-x64, darwin-arm64]
    env:
      TALEWRIGHT_RELEASE_TAG: ${{ github.ref_name }}
      TALEWRIGHT_VSIX_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tooling/vscode-talewright/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: npm ci --prefix tooling/vscode-talewright
      - name: Cross-package and inspect provisional platform (not a runtime smoke)
        working-directory: tooling/vscode-talewright
        run: |
          npm run package
          npm run test:package
      - uses: actions/upload-artifact@v4
        with:
          name: talewright-vscode-${{ matrix.target }}
          path: tooling/vscode-talewright/artifacts/talewright-${{ matrix.target }}.vsix
          if-no-files-found: error

  release-ready:
    needs: [build, tests, verification, cli-archives, provisional-vsix]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.identity.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release identity
        id: identity
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, ".github/scripts")
          from package_version import release_identity
          identity = release_identity(os.environ["GITHUB_REF_NAME"])
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"prerelease={str(identity['prerelease']).lower()}\n")
          PY
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/packages
      - uses: actions/download-artifact@v4
        with:
          name: talewright-vscode
          path: artifacts/extension
      - uses: actions/download-artifact@v4
        with:
          pattern: talewright-vscode-*
          merge-multiple: true
          path: artifacts/extension
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          merge-multiple: true
          path: artifacts/cli-archives
      - name: Verify CLI archive checksums
        run: |
          cd artifacts/cli-archives
          test "$(find . -name '*.sha256' | wc -l)" -eq 6
          for checksum in *.sha256; do sha256sum --check "$checksum"; done
      - name: Verify the exact release artifacts
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          test "$(python3 .github/scripts/package_version.py --tag "$GITHUB_REF_NAME")" = "$VERSION"
          python3 .github/scripts/verify_packages.py artifacts/packages "$VERSION"
          python3 .github/scripts/verify_release_vsix.py artifacts/extension "$GITHUB_REF_NAME" --all

  publish-nuget:
    needs: [build, release-ready]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-nuget.yml
    with:
      version: ${{ needs.build.outputs.version }}
    secrets:
      NUGET_USER: ${{ secrets.NUGET_USER }}

  publish-marketplace:
    needs: release-ready
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tooling/vscode-talewright/package-lock.json
      - run: npm ci --prefix tooling/vscode-talewright
      - uses: actions/download-artifact@v4
        with:
          name: talewright-vscode
          path: artifacts/extension
      - uses: actions/download-artifact@v4
        with:
          pattern: talewright-vscode-*
          merge-multiple: true
          path: artifacts/extension
      - name: Verify and publish every inspected VSIX (never rebuild)
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          PRERELEASE: ${{ needs.release-ready.outputs.prerelease }}
        run: |
          python3 .github/scripts/verify_release_vsix.py artifacts/extension "$GITHUB_REF_NAME" --all
          for vsix in "$GITHUB_WORKSPACE"/artifacts/extension/*.vsix; do
            args=(--packagePath "$vsix" --skip-duplicate)
            if [[ "$PRERELEASE" == true ]]; then args+=(--pre-release); fi
            tooling/vscode-talewright/node_modules/.bin/vsce publish "${args[@]}"
          done

  github-release:
    needs: [release-ready, publish-nuget, publish-marketplace]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: talewright-vscode
          path: artifacts/extension
      - uses: actions/download-artifact@v4
        with:
          pattern: talewright-vscode-*
          merge-multiple: true
          path: artifacts/extension
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          merge-multiple: true
          path: artifacts/cli-archives
      - name: Create or resume the release with generated notes and the tested VSIX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/verify_release_vsix.py artifacts/extension "$GITHUB_REF_NAME" --all
          python3 .github/scripts/github_release.py artifacts/extension/talewright.vsix --assets artifacts/extension/talewright-*.vsix artifacts/cli-archives/*
