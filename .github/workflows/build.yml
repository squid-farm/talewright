name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '37 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      selected: ${{ steps.select.outputs.selected }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Select verification from the Nx task graph
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$EVENT" == pull_request ]]; then
            python3 .github/scripts/nx_ci.py select --base "$BASE" --head "$HEAD"
          else
            python3 .github/scripts/nx_ci.py select --full
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nx-ci-plan
          path: artifacts/ci/plan.json
          if-no-files-found: error

  build:
    needs: select
    if: fromJSON(needs.select.outputs.selected).build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Resolve package version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version=$(python3 .github/scripts/package_version.py --tag "$GITHUB_REF_NAME")
          else
            version=$(python3 .github/scripts/package_version.py --ci "$GITHUB_RUN_NUMBER")
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: nx-ci-plan
          path: artifacts/ci
      - name: Build, pack and verify selected clean consumers
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 .github/scripts/nx_ci.py run build
      - uses: actions/upload-artifact@v4
        id: packages
        with:
          name: nuget-packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
      - name: Summarize Nx execution
        if: always()
        env:
          NX_CI_ARTIFACT_URL: ${{ steps.packages.outcome == 'success' && steps.packages.outputs.artifact-url || '' }}
        run: python3 .github/scripts/nx_ci.py summary build

  tests:
    needs: select
    uses: ./.github/workflows/tests.yml
    with:
      selected: ${{ needs.select.outputs.selected }}

  verification:
    name: CI verification
    if: always()
    needs: [select, build, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require successful selection and every selected job
        env:
          NEEDS: ${{ toJSON(needs) }}
          SELECTED: ${{ needs.select.outputs.selected }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, ".github/scripts")
          from nx_ci import verify_results
          results = json.loads(os.environ["NEEDS"])
          if results["select"]["result"] != "success":
              raise SystemExit("Nx selection failed, was skipped, or was cancelled")
          selected = json.loads(os.environ["SELECTED"])
          verify_results(results, {"select": True, "build": selected["build"], "tests": True})
          PY

  publish-samples:
    needs: [build, tests, verification]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-samples.yml

  publish-nuget:
    needs: [build, tests, verification]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-nuget.yml
    with:
      version: ${{ needs.build.outputs.version }}
