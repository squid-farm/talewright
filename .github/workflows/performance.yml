name: Real-file performance
run-name: Real-file performance on ${{ github.ref_name }}

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  benchmarks-and-publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      TALEWRIGHT_BENCHMARK_OUTPUT: ${{ github.workspace }}/artifacts/performance/metadata
      TALEWRIGHT_BENCHMARK_POWER_CACHE: GitHub-hosted ubuntu-24.04; power governor and filesystem cache are not controlled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Prepare owned artifact paths
        run: mkdir -p artifacts/performance
      - name: Build BenchmarkDotNet and CLI entry points
        run: dotnet build benchmarks/Talewright.BenchmarkDotNet -c Release
      - name: Verify every deterministic corpus and full history
        run: dotnet run --project benchmarks/Talewright.BenchmarkDotNet -c Release --no-build -- --verify-corpora
      - name: Run core BenchmarkDotNet suite
        run: >
          dotnet run --project benchmarks/Talewright.BenchmarkDotNet -c Release --no-build --
          --filter '*StoryBenchmarks*' --artifacts artifacts/performance/core
      - name: Run independent dimension BenchmarkDotNet suite
        run: >
          dotnet run --project benchmarks/Talewright.BenchmarkDotNet -c Release --no-build --
          --filter '*IndependentDimensionBenchmarks*' --artifacts artifacts/performance/dimensions
      - name: Run realistic story BenchmarkDotNet suite
        run: >
          dotnet run --project benchmarks/Talewright.BenchmarkDotNet -c Release --no-build --
          --filter '*RealisticStoryBenchmarks*' --artifacts artifacts/performance/realistic
      - name: Run exact and over-limit BenchmarkDotNet suite
        run: >
          dotnet run --project benchmarks/Talewright.BenchmarkDotNet -c Release --no-build --
          --filter '*BoundaryInputBenchmarks*' --artifacts artifacts/performance/boundaries
      - name: Generate the gigantic real-file corpus
        run: >
          dotnet run --project benchmarks/Talewright.BenchmarkDotNet -c Release --no-build --
          --generate-corpus Gigantic artifacts/performance/gigantic-story
          > artifacts/performance/gigantic-corpus.json
      - name: Measure full publication workloads with bounded timeouts
        run: >
          python3 benchmarks/performance/run_publication.py
          --story artifacts/performance/gigantic-story
          --cli tooling/cli/src/Talewright.Cli/bin/Release/net10.0/Talewright.Cli.dll
          --output artifacts/performance/publication
          --timeout-seconds 2700
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-file-benchmarks
          path: artifacts/performance
          if-no-files-found: error
          retention-days: 30

  browser-player:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    container:
      image: ghcr.io/squid-farm/talewright-ui-tests:pw1.63.0-r1
      options: --user 1001:1001 --init --shm-size=1g
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - name: Verify prebuilt UI test environment
        run: python3 .github/docker/ui-tests/verify.py
      - name: Run real-file browser measurements
        run: >
          python3 player/tests/run_e2e.py web --browser ${{ matrix.browser }}
          --filter 'FullyQualifiedName~RealCorpusBrowserPerformanceTests'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-file-player-${{ matrix.browser }}
          path: artifacts/test-results
          if-no-files-found: error
          retention-days: 30

  linux-photino:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    container:
      image: ghcr.io/squid-farm/talewright-ui-tests:pw1.63.0-r1
      options: --user 1001:1001 --init --shm-size=1g
    steps:
      - uses: actions/checkout@v4
      - name: Verify prebuilt UI test environment
        run: python3 .github/docker/ui-tests/verify.py
      - name: Run real-file Linux Photino measurements
        run: >
          python3 player/tests/run_e2e.py linux
          --filter 'FullyQualifiedName~RealCorpusNativePerformanceTests'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-file-player-linux-photino
          path: artifacts/test-results
          if-no-files-found: error
          retention-days: 30

  publish-results:
    if: always()
    needs:
      - benchmarks-and-publication
      - browser-player
      - linux-photino
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: real-file-performance-history
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: real-file-*
          path: artifacts/performance-input
      - name: Prepare durable history branch
        env:
          HISTORY_PATH: ${{ runner.temp }}/performance-history
        run: |
          if git ls-remote --exit-code origin refs/heads/performance-results >/dev/null; then
            git fetch --no-tags origin refs/heads/performance-results
            git worktree add --detach "$HISTORY_PATH" FETCH_HEAD
          else
            git worktree add --detach "$HISTORY_PATH" "$GITHUB_SHA"
            git -C "$HISTORY_PATH" switch --orphan "performance-history-$GITHUB_RUN_ID"
          fi
      - name: Generate run report and update trend history
        env:
          HISTORY_PATH: ${{ runner.temp }}/performance-history
          REPORT_PATH: ${{ runner.temp }}/performance-report
          PERF_BENCHMARKS_RESULT: ${{ needs.benchmarks-and-publication.result }}
          PERF_BROWSER_RESULT: ${{ needs.browser-player.result }}
          PERF_PHOTINO_RESULT: ${{ needs.linux-photino.result }}
        run: |
          python3 benchmarks/performance/publish_results.py \
            --input artifacts/performance-input \
            --output "$REPORT_PATH" \
            --history "$HISTORY_PATH"
          cat "$REPORT_PATH/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish run summary and durable trend history
        env:
          HISTORY_PATH: ${{ runner.temp }}/performance-history
        run: |
          : "${HISTORY_PATH:?HISTORY_PATH must be set}"
          git -C "$HISTORY_PATH" add index.md reports runs
          git -C "$HISTORY_PATH" \
            -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Record performance run $GITHUB_RUN_ID"
          git -C "$HISTORY_PATH" push origin HEAD:refs/heads/performance-results
      - uses: actions/upload-artifact@v4
        with:
          name: real-file-performance-summary
          path: ${{ runner.temp }}/performance-report
          if-no-files-found: error
          retention-days: 30
