name: Issue Intake

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  triage:
    if: >-
      ${{ !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)
          && !contains(github.event.issue.labels.*.name, 'status:triage') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Mark external submissions for triage
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE_NUMBER" --add-label status:triage
