name: Issue Intake

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  triage:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Mark external submissions for triage
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/issue_intake.py
