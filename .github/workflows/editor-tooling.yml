name: Editor tooling

on:
  workflow_call:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TALEWRIGHT_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tooling/vscode-talewright/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          name: nx-ci-plan
          path: artifacts/ci
      - run: npm ci --prefix tooling/vscode-talewright
      - run: python3 .github/scripts/nx_ci.py run editor
      - uses: actions/upload-artifact@v4
        id: extension
        if: hashFiles('tooling/vscode-talewright/artifacts/talewright.vsix') != ''
        with:
          name: talewright-vscode
          path: tooling/vscode-talewright/artifacts/talewright.vsix
          if-no-files-found: error
      - name: Summarize Nx execution
        if: always()
        env:
          NX_CI_ARTIFACT_URL: ${{ steps.extension.outcome == 'success' && steps.extension.outputs.artifact-url || '' }}
        run: python3 .github/scripts/nx_ci.py summary editor
