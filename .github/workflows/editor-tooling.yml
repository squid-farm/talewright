name: Editor tooling

on:
  pull_request:
    paths:
      - 'tooling/vscode-talewright/**'
      - 'tests/Talewright.Tale.Tests/**'
      - 'src/Talewright.Tale/**'
      - 'samples/**'
      - 'docs/**'
      - 'examples/**'
      - '.github/workflows/editor-tooling.yml'
  push:
    branches: [main]
    paths:
      - 'tooling/vscode-talewright/**'
      - 'tests/Talewright.Tale.Tests/**'
      - 'src/Talewright.Tale/**'
      - 'samples/**'
      - 'docs/**'
      - 'examples/**'
      - '.github/workflows/editor-tooling.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tooling/vscode-talewright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tooling/vscode-talewright/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: npm ci
      - run: npm test
      - run: dotnet test ../../tests/Talewright.Tale.Tests -c Release
      - run: npm run package && npm run test:package
      - run: xvfb-run -a npm run test:editor
      - uses: actions/upload-artifact@v4
        with:
          name: talewright-vscode
          path: tooling/vscode-talewright/artifacts/talewright.vsix
          if-no-files-found: error
