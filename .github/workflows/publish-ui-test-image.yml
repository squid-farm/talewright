name: Publish UI test image

# Publishes the tag from .github/docker/ui-tests/image.json only when it is not already in GHCR.
# Changing the image definition without bumping that tag fails, so published tags never change content.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/docker/ui-tests/**'
      - '.github/scripts/ui_test_image_plan.py'
      - '.github/workflows/publish-ui-test-image.yml'
  pull_request:
    paths:
      - '.github/docker/ui-tests/**'
      - '.github/scripts/ui_test_image_plan.py'
      - '.github/workflows/publish-ui-test-image.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      reference: ${{ steps.plan.outputs.reference }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether the image changed
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/ui_test_image_plan.py --event "$EVENT" --ref "$GITHUB_REF" --base "$BASE" --head "$HEAD"
      - name: Build candidate image
        if: steps.plan.outputs.build == 'true'
        run: docker build -t talewright-ui-tests:candidate .github/docker/ui-tests
      - name: Verify browser and native prerequisites in the candidate
        if: steps.plan.outputs.build == 'true'
        run: |
          docker run --rm --init --shm-size=1g \
            --user 1001:1001 \
            -e HOME=/tmp/talewright-ui-home \
            -v "$PWD":/workspace \
            talewright-ui-tests:candidate \
            bash -e -c 'mkdir -p "$HOME"; python3 /opt/talewright-ui/verify.py; python3 player/tests/run_e2e.py web --filter FullyQualifiedName~StoryLoadingTests; python3 player/tests/run_e2e.py linux --probe'
      - name: Save validated candidate
        if: steps.plan.outputs.publish == 'true'
        run: docker save talewright-ui-tests:candidate | gzip > "${{ runner.temp }}/ui-test-image.tar.gz"
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.publish == 'true'
        with:
          name: ui-test-image-candidate
          path: ${{ runner.temp }}/ui-test-image.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  publish:
    if: needs.validate.outputs.publish == 'true' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-ui-test-image
      cancel-in-progress: false
    env:
      IMAGE_REFERENCE: ${{ needs.validate.outputs.reference }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ui-test-image-candidate
          path: ${{ runner.temp }}/ui-test-image
      - name: Load validated candidate
        run: docker load -i "${{ runner.temp }}/ui-test-image/ui-test-image.tar.gz"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish versioned image
        run: |
          python3 - <<'PY'
          import os, subprocess
          reference = os.environ["IMAGE_REFERENCE"]
          result = subprocess.run(["docker", "manifest", "inspect", reference], capture_output=True, text=True)
          if result.returncode == 0:
              raise SystemExit(f"Refusing to overwrite {reference}; choose a new revision")
          if not any(message in result.stderr.lower() for message in ("manifest unknown", "no such manifest")):
              raise SystemExit(f"Cannot establish that {reference} is unused: {result.stderr}")
          PY
          docker tag talewright-ui-tests:candidate "$IMAGE_REFERENCE"
          docker push "$IMAGE_REFERENCE"
      - name: Show immutable digest for workflow updates
        run: |
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_REFERENCE")"
          echo "Published: ${digest}"
          echo "Published: ${digest}" >> "$GITHUB_STEP_SUMMARY"
