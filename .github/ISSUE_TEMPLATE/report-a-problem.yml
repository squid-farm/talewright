name: Report a problem
description: Tell us about something that is not working in Talewright.
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Describe it below so we can investigate.
        Reports are public. Don't include private story files or personal information.
        Story files are optional; you can report a problem without sharing your story.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and where you encountered it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you try?
      description: List the steps that led to the problem, if you can.
    validations:
      required: false
  - type: input
    id: operating-system
    attributes:
      label: Operating system
      description: For example, Windows 11, macOS 15, or Ubuntu 24.04. Enter "Not sure" if needed.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Talewright version
      description: Include the download or extension version, if known. For the web player, you can enter "Web player".
    validations:
      required: false
  - type: textarea
    id: error-details
    attributes:
      label: Error message or screenshot (optional)
      description: Paste the exact error message or attach a screenshot. Remove personal information, including usernames in file paths.
    validations:
      required: false
